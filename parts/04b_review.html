    <!-- ====================================================== -->
    <!-- STAGE 4 (REVIEW): PRATINJAU HASIL FOTO & RETAKE        -->
    <!-- ====================================================== -->
    <section id="stage-review"
      class="hidden flex-1 w-full overflow-y-auto no-scrollbar studio-editorial-bg flex flex-col justify-between p-3.5 sm:p-5 md:p-6">
      
      <!-- A. REVIEW HEADER -->
      <div class="max-w-5xl mx-auto w-full flex items-center justify-between pb-3 border-b border-gray-200/80 gap-3">
        <button onclick="App.navigate('camera')"
          class="px-3.5 py-1.5 rounded-full bg-white border border-gray-200 text-pozia-charcoal text-xs font-bold hover:bg-gray-50 transition-all flex items-center gap-1.5 shadow-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          <span>Kembali ke Kamera</span>
        </button>

        <div class="text-center">
          <h2 class="text-base sm:text-lg font-bold font-serif text-pozia-charcoal">
            Pratinjau Hasil Pemotretan
          </h2>
          <p class="text-[11px] text-gray-500 hidden sm:block">
            Periksa foto Anda, terapkan filter analog, atau ambil ulang pose tertentu.
          </p>
        </div>

        <span id="review-pose-badge" class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 font-bold text-xs">
          4 Pose Lengkap
        </span>
      </div>

      <!-- B. MAIN PHOTO PREVIEW AREA (BALANCED & PROPORTIONAL) -->
      <div class="max-w-5xl mx-auto w-full flex-1 flex items-center justify-center py-3 sm:py-4">
        <div id="review-photos-display"
          class="w-full flex flex-wrap items-center justify-center gap-3 sm:gap-4 md:gap-5">
          <!-- Dynamically populated by ReviewStudio.render() -->
        </div>
      </div>

      <!-- C. DEDICATED FILTER SECTION (HORIZONTAL SCROLLING DOCK) -->
      <div class="max-w-5xl mx-auto w-full py-2.5 bg-white/80 backdrop-blur-md rounded-2xl border border-gray-200/80 p-2.5 sm:p-3 shadow-sm flex flex-col gap-2">
        <div class="flex items-center justify-between text-xs px-1">
          <span class="font-bold text-gray-600">Pilih Filter Analog:</span>
          <span id="review-active-filter-name" class="font-bold text-pozia-coral">Original</span>
        </div>

        <div id="review-filters-dock" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
          <!-- Dynamically populated with 14 filter cards with live swatches -->
        </div>
      </div>

      <!-- D. BOTTOM BUTTONS ROW: RETAKE ALL & PROCEED TO EDITOR -->
      <div class="max-w-5xl mx-auto w-full pt-3 flex flex-col sm:flex-row items-center justify-between gap-3">
        <button onclick="CameraStudio.confirmRetakeAll()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl bg-white border border-gray-200 text-gray-600 hover:text-red-600 hover:border-red-200 text-xs font-bold transition-all shadow-sm">
          Foto Ulang Semua
        </button>

        <button onclick="App.navigate('editor')"
          class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-pozia-coral text-white font-bold text-sm shadow-xl shadow-pozia-coral/30 hover:bg-pozia-coral-hover active:scale-95 transition-all flex items-center justify-center gap-2">
          <span>Lanjut Pilih Desain Frame</span> &rarr;
        </button>
      </div>
    </section>
