    <!-- ====================================================== -->
    <!-- STAGE 5 (EDITOR): STUDIO EDITOR & FRAME WORKSTATION    -->
    <!-- ====================================================== -->
    <section id="stage-editor" class="hidden flex-1 w-full flex flex-col md:flex-row overflow-hidden bg-pozia-bg">
      
      <!-- Left / Center: Soft Editorial Studio Artboard (Well-Proportioned: 46% Width, Whole Frame Visible) -->
      <div
        class="w-full md:w-[46%] h-[42vh] md:h-full studio-artboard-bg p-3 md:p-6 flex flex-col items-center justify-center relative overflow-hidden select-none shrink-0">
        
        <!-- Artboard Alignment Marks -->
        <div class="absolute top-4 left-4 text-white/20 font-mono text-sm pointer-events-none">+</div>
        <div class="absolute top-4 right-4 text-white/20 font-mono text-sm pointer-events-none">+</div>
        <div class="absolute bottom-4 left-4 text-white/20 font-mono text-sm pointer-events-none">+</div>
        <div class="absolute bottom-4 right-4 text-white/20 font-mono text-sm pointer-events-none">+</div>

        <!-- Ambient Center Spotlight -->
        <div class="absolute w-80 h-80 rounded-full bg-pozia-coral/10 blur-3xl pointer-events-none"></div>

        <!-- Interactive Canvas Viewport (100% Whole Frame Visible from Top to Bottom) -->
        <div id="interactive-preview-container"
          class="relative transition-all duration-300 studio-elevation rounded-2xl overflow-hidden bg-transparent max-h-[72vh] max-w-full flex items-center justify-center border border-white/20">
          <canvas id="editor-preview-canvas" class="max-h-[34vh] md:max-h-[66vh] max-w-[92%] w-auto h-auto block select-none cursor-pointer object-contain rounded-xl"></canvas>
        </div>

        <!-- Artboard Floating Status Badges -->
        <div class="mt-2.5 flex items-center gap-2">
          <div class="px-2.5 py-0.5 md:px-3 md:py-1 rounded-full bg-white/10 backdrop-blur-md border border-white/15 text-[10px] md:text-[11px] text-gray-300 font-medium flex items-center gap-1.5 shadow-sm">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            <span>Pozia Live Studio Canvas</span>
          </div>
          <div class="hidden sm:flex px-2.5 py-0.5 md:px-3 md:py-1 rounded-full bg-black/40 backdrop-blur-md border border-white/10 text-[10px] text-gray-400">
            <span data-i18n="editor_slot_hint">Klik slot foto untuk mengganti</span>
          </div>
        </div>
      </div>

      <!-- Right Control Panel: Spacious Workstation (54% Width, Independent Scrolling) -->
      <div
        class="w-full md:w-[54%] flex-1 md:h-full bg-white border-t md:border-t-0 md:border-l border-gray-200/80 flex flex-col justify-between overflow-hidden shadow-sm min-h-0">

        <!-- Top Navigation Bar: Back + Undo/Redo/Reset + Tabs + Finish -->
        <div class="border-b border-gray-100 px-4 py-3 flex items-center justify-between bg-white z-10 gap-2 overflow-x-auto no-scrollbar">
          
          <!-- Back to Review Button -->
          <button onclick="App.navigate('review')"
            class="shrink-0 px-3 py-1.5 rounded-xl bg-gray-100 text-pozia-charcoal text-xs font-bold hover:bg-gray-200 transition-all flex items-center gap-1.5 shadow-sm"
            title="Kembali ke Review">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span>Review</span>
          </button>

          <!-- History Controls: Undo, Redo, Reset -->
          <div class="shrink-0 flex items-center gap-1 bg-gray-100 p-0.5 rounded-xl">
            <!-- Undo -->
            <button id="editor-undo-btn" onclick="EditorStudio.undo()" disabled
              class="w-7 h-7 rounded-lg text-gray-600 hover:text-pozia-coral hover:bg-white flex items-center justify-center transition-all opacity-40 disabled:pointer-events-none"
              title="Batalkan Perubahan (Undo)">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a5 5 0 015 5v2M3 10l6 6m-6-6l6-6" />
              </svg>
            </button>
            <!-- Redo -->
            <button id="editor-redo-btn" onclick="EditorStudio.redo()" disabled
              class="w-7 h-7 rounded-lg text-gray-600 hover:text-pozia-coral hover:bg-white flex items-center justify-center transition-all opacity-40 disabled:pointer-events-none"
              title="Ulangi Perubahan (Redo)">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a5 5 0 00-5 5v2m15-7l-6 6m6-6l-6-6" />
              </svg>
            </button>
            <!-- Reset -->
            <button id="editor-reset-btn" onclick="EditorStudio.reset()"
              class="px-2 h-7 rounded-lg text-gray-600 hover:text-pozia-coral hover:bg-white text-[11px] font-bold flex items-center gap-1 transition-all"
              title="Reset Pengaturan">
              <span>Reset</span>
            </button>
          </div>

          <!-- Navigation Tabs: Frame & Filter -->
          <div class="shrink-0 flex items-center gap-1 bg-gray-100 p-1 rounded-xl">
            <button onclick="EditorStudio.switchTab('frame')" id="tab-btn-frame"
              class="px-4 py-1.5 text-xs font-bold text-white bg-pozia-coral rounded-lg transition-all shadow-sm">
              <span data-i18n="tab_frame">Bingkai</span>
            </button>
            <button onclick="EditorStudio.switchTab('filter')" id="tab-btn-filter"
              class="px-4 py-1.5 text-xs font-semibold text-gray-600 rounded-lg transition-all hover:text-pozia-coral">
              <span data-i18n="tab_filter">Filter</span>
            </button>
          </div>

          <!-- CTAs: Random Vibe & Finish -->
          <div class="shrink-0 flex items-center gap-1.5">
            <button onclick="EditorStudio.randomVibe()" title="Acak Tema Bingkai & Filter"
              class="px-3 py-1.5 rounded-xl bg-pozia-lilac/15 text-pozia-lilac text-xs font-bold hover:bg-pozia-lilac hover:text-white transition-all flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span data-i18n="random_vibe">Acak Vibe</span>
            </button>
            <button onclick="App.exportFinalImage()"
              class="px-4 py-1.5 rounded-xl bg-pozia-coral text-white text-xs font-bold shadow-md shadow-pozia-coral/25 hover:bg-pozia-coral-hover active:scale-95 transition-all flex items-center gap-1">
              <span data-i18n="done_btn">Selesai</span> &rarr;
            </button>
          </div>
        </div>

        <!-- Scrollable Tab Content Area -->
        <div class="flex-1 overflow-y-auto no-scrollbar p-5 md:p-6">

          <!-- TAB 1: BINGKAI (FRAMES & FORMAT SWITCHER) -->
          <div id="tab-content-frame" class="flex flex-col gap-4">
            
            <!-- Format Layout Switcher -->
            <div class="flex items-center justify-between pb-3 border-b border-gray-100 gap-2">
              <span class="text-xs text-gray-500 font-bold shrink-0" data-i18n="editor_format_label">Format Layout:</span>
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                <button onclick="App.setLayout('1x4'); EditorStudio.renderCanvas();" id="frame-layout-1x4"
                  class="px-2.5 py-1 text-xs font-bold rounded-lg bg-pink-50 text-pozia-coral border border-pozia-coral transition-all shrink-0">Strip 4</button>
                <button onclick="App.setLayout('1x3'); EditorStudio.renderCanvas();" id="frame-layout-1x3"
                  class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-100 text-gray-600 transition-all shrink-0">Strip 3</button>
                <button onclick="App.setLayout('1x2'); EditorStudio.renderCanvas();" id="frame-layout-1x2"
                  class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-100 text-gray-600 transition-all shrink-0">Strip 2</button>
                <button onclick="App.setLayout('2x2'); EditorStudio.renderCanvas();" id="frame-layout-2x2"
                  class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-100 text-gray-600 transition-all shrink-0">Grid 2x2</button>
                <button onclick="App.setLayout('polaroid'); EditorStudio.renderCanvas();" id="frame-layout-polaroid"
                  class="px-2.5 py-1 text-xs font-semibold rounded-lg bg-gray-100 text-gray-600 transition-all shrink-0">Polaroid</button>
              </div>
            </div>

            <!-- Frame Category Filter Pills -->
            <div>
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1" id="frame-category-pills">
                <button onclick="EditorStudio.filterCategory('all')" id="cat-btn-all"
                  class="px-3 py-1 rounded-full text-xs font-bold bg-pozia-coral text-white whitespace-nowrap shadow-sm" data-i18n="cat_all">Semua</button>
                <button onclick="EditorStudio.filterCategory('gaming')" id="cat-btn-gaming"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_gaming">Gaming</button>
                <button onclick="EditorStudio.filterCategory('scrapbook')" id="cat-btn-scrapbook"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_scrapbook">Scrapbook</button>
                <button onclick="EditorStudio.filterCategory('cyber')" id="cat-btn-cyber"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_cyber">Y2K Cyber</button>
                <button onclick="EditorStudio.filterCategory('comic')" id="cat-btn-comic"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_comic">Pop Comic</button>
                <button onclick="EditorStudio.filterCategory('music')" id="cat-btn-music"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_music">Music</button>
                <button onclick="EditorStudio.filterCategory('summer')" id="cat-btn-summer"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_summer">Summer</button>
                <button onclick="EditorStudio.filterCategory('retro')" id="cat-btn-retro"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_retro">Retro</button>
                <button onclick="EditorStudio.filterCategory('fantasy')" id="cat-btn-fantasy"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_fantasy">Magical</button>
                <button onclick="EditorStudio.filterCategory('solid')" id="cat-btn-solid"
                  class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 whitespace-nowrap" data-i18n="cat_solid">Minimalist</button>
              </div>
            </div>

            <!-- Designer Frames Grid (Populated with REAL THEME MINIATURE ARTWORK) -->
            <div class="grid grid-cols-2 gap-3" id="designer-frames-grid">
              <!-- Dynamically populated with 20 rich designer frame cards -->
            </div>

            <!-- Custom Frame Upload Section -->
            <div class="pt-2 border-t border-gray-100">
              <button onclick="document.getElementById('custom-frame-input').click()"
                class="w-full py-2.5 px-4 rounded-xl border border-dashed border-gray-300 hover:border-pozia-coral hover:bg-pink-50/50 text-xs font-bold text-gray-600 hover:text-pozia-coral transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4 text-pozia-coral" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span data-i18n="upload_custom_frame">Upload Custom Twibbon PNG</span>
              </button>
            </div>
          </div>

          <!-- TAB 2: FILTER (14 ANALOG FILTERS & FINE TUNING) -->
          <div id="tab-content-filter" class="hidden flex flex-col gap-4">
            
            <div class="flex items-center justify-between pb-2 border-b border-gray-100">
              <span class="text-xs text-gray-500 font-bold" data-i18n="filter_heading">14 Preset Filter Analog & Film:</span>
              <span class="text-xs font-bold text-pozia-coral" id="active-filter-badge">Original</span>
            </div>

            <!-- 14 Filters Grid -->
            <div class="grid grid-cols-2 gap-2" id="filter-presets-grid">
              <!-- Dynamically populated with 14 filter cards with live swatches -->
            </div>

            <!-- Intensity & Fine Adjustments -->
            <div class="pt-4 border-t border-gray-100 flex flex-col gap-3">
              <div>
                <div class="flex items-center justify-between text-xs mb-1">
                  <span class="text-gray-500 font-semibold" data-i18n="intensity">Intensitas Filter:</span>
                  <span id="intensity-val-text" class="font-bold text-pozia-coral">100%</span>
                </div>
                <input type="range" id="filter-intensity-slider" min="0" max="100" value="100"
                  oninput="EditorStudio.setFilterIntensity(this.value)" class="w-full accent-pozia-coral">
              </div>

              <div>
                <div class="flex items-center justify-between text-xs mb-1">
                  <span class="text-gray-500 font-semibold" data-i18n="fine_brightness">Fine Brightness:</span>
                  <span id="brightness-val-text" class="font-bold text-pozia-coral">0</span>
                </div>
                <input type="range" id="manual-brightness-slider" min="-30" max="30" value="0"
                  oninput="EditorStudio.setManualAdjust('brightness', this.value)" class="w-full accent-pozia-coral">
              </div>

              <div>
                <div class="flex items-center justify-between text-xs mb-1">
                  <span class="text-gray-500 font-semibold" data-i18n="fine_contrast">Fine Contrast:</span>
                  <span id="contrast-val-text" class="font-bold text-pozia-coral">0</span>
                </div>
                <input type="range" id="manual-contrast-slider" min="-30" max="30" value="0"
                  oninput="EditorStudio.setManualAdjust('contrast', this.value)" class="w-full accent-pozia-coral">
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
