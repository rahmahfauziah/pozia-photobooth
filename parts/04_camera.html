    <!-- ====================================================== -->
    <!-- STAGE 3 (CAMERA): STUDIO KAMERA                        -->
    <!-- ====================================================== -->
    <section id="stage-camera"
      class="hidden flex-1 w-full flex flex-col md:flex-row bg-pozia-dark text-white overflow-hidden">
      
      <!-- Left / Main Stage: Viewfinder -->
      <div
        class="w-full md:w-[62%] h-[60vh] md:h-full flex flex-col relative bg-black/60 justify-between p-4 md:p-6 overflow-hidden">
        
        <!-- Viewfinder Top Bar -->
        <div class="flex items-center justify-between z-20 gap-2">
          <!-- Back to Setup Button -->
          <button onclick="CameraStudio.handleBack()"
            class="px-3.5 py-1.5 rounded-full bg-white/10 backdrop-blur-md text-xs font-bold hover:bg-white/20 transition-all flex items-center gap-1.5 text-white"
            title="Kembali ke Pengaturan">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span data-i18n="back_btn">Kembali</span>
          </button>

          <!-- Pose Progress Counter -->
          <div
            class="px-4 py-1.5 rounded-full bg-white/15 backdrop-blur-md text-xs font-extrabold tracking-wider flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-pozia-coral ring-2 ring-pozia-coral/30"></span>
            <span id="pose-counter-text">Foto 1 dari 4</span>
          </div>

          <!-- Camera Lens Switch & Mirror Controls -->
          <div class="flex items-center gap-2">
            <!-- Switch Camera Lens (Front/Back) -->
            <button id="cam-switch-btn" onclick="CameraStudio.switchFacingMode()"
              class="hidden px-3 py-1.5 rounded-full bg-white/10 backdrop-blur-md text-xs font-bold hover:bg-white/20 transition-all flex items-center gap-1.5 text-white"
              title="Ganti Lensa Kamera">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              <span class="hidden sm:inline">Ganti Lensa</span>
            </button>

            <!-- Mirror Horizontal Flip Toggle -->
            <button id="cam-mirror-btn" onclick="CameraStudio.toggleMirror()"
              class="px-3 py-1.5 rounded-full bg-pozia-coral text-white text-xs font-bold shadow-md flex items-center gap-1.5 transition-all"
              title="Mirror Kamera ON / OFF">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
              <span id="mirror-status-text">Mirror ON</span>
            </button>
          </div>
        </div>

        <!-- Viewfinder Center Screen -->
        <div class="absolute inset-0 flex items-center justify-center overflow-hidden">
          <div id="screen-flash"></div>

          <!-- Countdown Overlay -->
          <div id="countdown-overlay"
            class="absolute z-30 opacity-0 pointer-events-none transition-opacity duration-200 flex flex-col items-center">
            <span id="countdown-num"
              class="text-8xl md:text-9xl font-extrabold text-white drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] font-serif animate-pulse">
              3
            </span>
            <span class="text-sm font-bold tracking-widest uppercase text-white/80 mt-2">Get Ready!</span>
          </div>

          <!-- Retake Notification Banner -->
          <div id="retake-banner"
            class="hidden absolute top-16 z-30 px-4 py-1.5 rounded-full bg-amber-500/95 text-white text-xs font-bold shadow-xl flex items-center gap-2">
            <span>📷</span>
            <span id="retake-banner-text">Mengambil Ulang Pose 1</span>
          </div>

          <!-- Live Video Stream with Real-time CSS Filter & Mirror Transform -->
          <video id="live-video" autoplay playsinline muted
            class="w-full h-full object-cover transition-transform duration-200 select-none"></video>

          <!-- Fallback Camera Message -->
          <div id="camera-fallback-msg"
            class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center p-6 text-center bg-gray-900/90 backdrop-blur-md">
            <div class="w-14 h-14 rounded-full bg-pozia-coral/20 flex items-center justify-center text-pozia-coral mb-3">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
              </svg>
            </div>
            <h3 class="font-bold text-base text-white mb-1">Akses Kamera Ditolak / Tidak Tersedia</h3>
            <p class="text-xs text-gray-300 max-w-xs mb-4" data-i18n="cam_error">
              Kamera tidak dapat diakses atau diblokir. Anda tetap bisa upload foto dari galeri!
            </p>
            <button onclick="App.triggerGalleryUpload()"
              class="px-5 py-2.5 rounded-xl bg-pozia-coral text-white text-xs font-bold shadow-lg">
              Upload Foto dari Galeri
            </button>
          </div>
        </div>

        <!-- Viewfinder Live Filter Dock (14 Real-Time Filters) -->
        <div class="z-20">
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="camera-filter-dock">
            <!-- Dynamically populated with 14 filter buttons -->
          </div>
        </div>
      </div>

      <!-- Right Control Panel: Settings & Shutter -->
      <div
        class="w-full md:w-[38%] h-[40vh] md:h-full bg-pozia-dark border-t md:border-t-0 md:border-l border-white/10 p-5 md:p-8 flex flex-col justify-between overflow-y-auto no-scrollbar">
        
        <div>
          <div class="flex items-center justify-between pb-3 border-b border-white/10">
            <h3 class="font-serif font-bold text-base text-white" data-i18n="camera_settings">Kontrol Kamera</h3>
            <span class="text-[11px] text-gray-400 font-mono">HD VIEW</span>
          </div>

          <!-- Camera Parameters -->
          <div class="py-3 flex flex-col gap-3.5 text-xs">
            <!-- Timer Countdown -->
            <div>
              <label class="block text-gray-400 font-semibold mb-1.5" data-i18n="timer_label">Timer Countdown:</label>
              <div class="grid grid-cols-4 gap-1.5">
                <button onclick="CameraStudio.setTimer(0)" id="cam-timer-0"
                  class="py-2 rounded-xl bg-white/10 text-gray-300 font-bold">Off</button>
                <button onclick="CameraStudio.setTimer(3)" id="cam-timer-3"
                  class="py-2 rounded-xl bg-pozia-coral text-white font-bold">3 Detik</button>
                <button onclick="CameraStudio.setTimer(5)" id="cam-timer-5"
                  class="py-2 rounded-xl bg-white/10 text-gray-300 font-bold">5 Detik</button>
                <button onclick="CameraStudio.setTimer(10)" id="cam-timer-10"
                  class="py-2 rounded-xl bg-white/10 text-gray-300 font-bold">10 Detik</button>
              </div>
            </div>

            <!-- Screen Flash Color -->
            <div>
              <label class="block text-gray-400 font-semibold mb-1.5" data-i18n="flash_color">Screen Flash Warna:</label>
              <div class="grid grid-cols-4 gap-1.5">
                <button onclick="CameraStudio.setFlashColor('white')" id="flash-color-white"
                  class="py-2 rounded-xl bg-pozia-coral text-white font-bold shadow-sm">White</button>
                <button onclick="CameraStudio.setFlashColor('peach')" id="flash-color-peach"
                  class="py-2 rounded-xl bg-white/10 text-gray-300 font-bold">Peach</button>
                <button onclick="CameraStudio.setFlashColor('pink')" id="flash-color-pink"
                  class="py-2 rounded-xl bg-white/10 text-gray-300 font-bold">Pink</button>
                <button onclick="CameraStudio.setFlashColor('off')" id="flash-color-off"
                  class="py-2 rounded-xl bg-white/10 text-gray-300 font-bold">Off</button>
              </div>
            </div>

            <!-- Digital Zoom & Exposure -->
            <div class="pt-2 border-t border-white/10 flex flex-col gap-2.5">
              <div class="flex items-center justify-between">
                <span class="text-gray-400 font-semibold">Digital Zoom:</span>
                <span id="zoom-val-label" class="font-bold text-white">1.0x</span>
              </div>
              <input type="range" id="zoom-slider" min="1.0" max="2.0" step="0.1" value="1.0"
                oninput="CameraStudio.setZoom(this.value)" class="w-full accent-pozia-coral">

              <div class="flex items-center justify-between pt-1">
                <span class="text-gray-400 font-semibold">Exposure / Kecerahan:</span>
                <span id="exposure-val-label" class="font-bold text-white">0</span>
              </div>
              <input type="range" id="exposure-slider" min="-30" max="30" step="5" value="0"
                oninput="CameraStudio.setExposure(this.value)" class="w-full accent-pozia-coral">
            </div>
          </div>
        </div>

        <!-- Camera Bottom Action Row -->
        <div class="flex items-center justify-between pt-4 border-t border-white/10">
          <button onclick="App.triggerGalleryUpload()"
            class="p-3 rounded-2xl bg-white/10 hover:bg-white/20 transition-all flex flex-col items-center gap-1"
            title="Upload dari galeri">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
            <span class="text-[10px] text-gray-400">Upload</span>
          </button>

          <!-- Hero Shutter Button -->
          <button id="shutter-btn" onclick="CameraStudio.startCaptureSequence()"
            class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center bg-pozia-coral shutter-glow active:scale-95 transition-transform shadow-2xl">
            <div class="w-14 h-14 rounded-full bg-white/25"></div>
          </button>

          <!-- Review Button (Enabled if photos taken) -->
          <button onclick="ReviewStudio.openReview()"
            class="p-3 rounded-2xl bg-white/10 hover:bg-white/20 transition-all flex flex-col items-center gap-1"
            title="Lihat Hasil Foto">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <span class="text-[10px] text-gray-400">Review</span>
          </button>
        </div>
      </div>
    </section>
